[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cms-data-mcp"
version = "0.0.1"
description = "A bounded CMS aggregate MCP workflow with traceable provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "httpx2>=2.13.1,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1,<2",
    "PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cms_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "integration: local SDK, HTTP adapter, or storage integration",
    "live: explicit opt-in checks against approved public CMS sources",
    "eval: agent usability scenarios, distinct from deterministic tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
